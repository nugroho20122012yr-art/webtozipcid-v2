<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Scrape — Web to ZIP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/webtozip/assets/style.css">
<script src="/webtozip/proxy/proxy.js"></script>
</head>
<body>
<nav class="glass bar"><a class="brand" href="/webtozip/"><b>&lt;/&gt;</b>WebArchiver</a><span class="links"><a  href="/webtozip/">~/ Beranda</a><a class="on" href="/webtozip/scrape/">&gt;_ Scrape</a><a  href="/webtozip/api-key/">{ } API Key</a></span></nav>
<main>
<section class="glass card">
<h1>Scrape daftar aset.</h1>
<p class="sub">Lihat semua aset yang ditemukan di sebuah halaman tanpa membuat ZIP dan tanpa API key. Tidak memakai poin.</p>
<form id="f" novalidate>
<label for="url">URL target</label>
<input id="url" type="url" placeholder="https://example.com" autocomplete="off" required>
<button class="btn full" name="go" type="submit">&gt;_ Scrape sekarang</button>
</form>
<div class="st" id="st" role="status">// siap</div>
<ul class="list" id="out"></ul>
</section>
</main>
<script src="/webtozip/assets/app.js"></script>
<script>
var f = document.getElementById('f'), st = document.getElementById('st'), out = document.getElementById('out');
f.addEventListener('submit', async function (e) {
  e.preventDefault();
  var url = document.getElementById('url').value.trim();
  if (!/^https?:\/\/.+/i.test(url)) { ui.info('URL tidak valid', 'Awali dengan https:// atau http://'); return; }
  st.textContent = '// memproses...'; out.textContent = ''; f.go.disabled = true;
  try {
    var r = await fetch('/webtozip/api/clone', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url, mode: 'scrape' }) });
    var j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Server ' + r.status);
    j.assets.forEach(function (a) { var li = document.createElement('li'); li.textContent = a; out.appendChild(li); });
    st.textContent = '=> ' + j.assets.length + ' aset ditemukan' + (j.title ? ' di "' + j.title.trim() + '"' : '');
  } catch (err) { st.textContent = '!! ' + err.message; }
  finally { f.go.disabled = false; }
});
</script>
</body>
</html>
